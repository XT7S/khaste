name: Build VLESS APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Expo project
        run: npx --yes create-expo-app@latest app --template blank
      - name: Add VLESS files
        run: |
          mkdir -p app/src app/plugins app/native-android
          cp App.js apply.js app/
          cp vless.js app/src/vless.js
          cp withVlessVpn.js app/plugins/
          cp *.kt app/native-android/
      - name: Prebuild
        working-directory: app
        run: |
          node apply.js
          npx expo prebuild --platform android
      - name: Copy core binaries if present
        run: |
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          for f in libxray.so libtun2socks.so; do
            if [ -f "$f" ]; then cp "$f" app/android/app/src/main/jniLibs/arm64-v8a/; echo "copied $f"; fi
          done
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: vless-vpn-apk
          path: app/android/app/build/outputs/apk/release/*.apk
